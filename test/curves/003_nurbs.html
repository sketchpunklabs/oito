<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title></title></head>
<style>canvas{ display:block; } body, html { padding:0px; margin:0px; width:100%; height:100%; }</style>
<body><script type="module">
// #region IMPORTS
import useThreeWebGL2, { useDarkScene, useVisualDebug } from '../_lib/useThreeWebGL2.js';
import { NurbsSpline, SplineSampler, SplineMinSamples } from '../../packages/curves/src/index.ts';
import { Vec3 } from '@oito/oop';
// #endregion

// #region MAIN
let App   = useDarkScene( useThreeWebGL2() );
let Debug = {};
let Ref   = {};

window.addEventListener( 'load', async _=>{
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Setup
    App.sphericalLook( 0, 20, 10 );
    Debug = await useVisualDebug( App );
    globalThis.Debug = Debug;

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    const spline = new NurbsSpline();
    
    // spline.degree = 3
    spline.add( [-2, 0, 0] );
    spline.add( [-1.5, 2, 0] );
    spline.add( [1, -0.5, 0] );
    spline.add( [ 2, 0, 0] );

    spline.generateKnots();

    // spline.at( 0.2, [0,0,0] );
    renderPoints( spline );
    renderTangent( spline, 10 );
    // renderSpline( spline, 20 );
    // renderSplineCurves( spline, 5, false );
    // renderControls( spline )

    // const samp = new SplineSampler().fromSpline( spline, 5 );
    // renderSamplerPnts( samp )

    // const samp = new SplineMinSamples()
    // samp.angleLimit = 176
    // samp.fromSpline( spline );
    // renderSamplerMinPnts( samp );
    // console.log( samp.lenAry )
    // console.log( samp.incAry )
    // console.log( samp.timeAry );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    App.renderLoop();
    // App.createRenderLoop( onPreRender ).start();
});

// function onPreRender( dt, et ){}
// #endregion

// #region LOREM
function renderPoints( spline ){
    for( let p of spline.points ){
        Debug.pnt.add( p.pos, 0x007777, 8 );
    }
}

function renderSpline( spline, samp=10 ){
    const prev  = new Vec3();
    const curr  = new Vec3();
    const dxdy  = new Vec3();
    const dxdy2 = new Vec3();
    let t;

    samp -= 1;

    spline.at( 0, prev );
    Debug.pnt.add( prev, 0x00ff00, 3 );
    for( let i=1; i <= samp; i++ ){
        t = i / samp;

        spline.at( t, curr, dxdy, dxdy2 );

        Debug.pnt.add( curr, 0x00ff00, 3 );
        Debug.ln.add( prev, curr, 0x00ff00 );
        // Debug.ln.add( curr, vec3.scaleThenAdd( vec3.norm( dxdy ), 0.5, curr ), 0xffffff );
        // Debug.ln.add( curr, vec3.scaleThenAdd( vec3.norm( dxdy2 ), 0.5, curr ), 0x00ffff );
        
        prev.copy( curr );
    }
}

function renderTangent( spline, samp=10 ){
    const prev  = new Vec3();
    const curr  = new Vec3();
    const dxdy  = new Vec3();
    let t;

    samp -= 1;

    spline.at( 0, prev, dxdy );
    Debug.pnt.add( prev, 0x00ff00, 3 );
    
    for( let i=1; i <= samp; i++ ){
        t = i / samp;

        spline.at( t, curr, dxdy );

        console.log( t, curr, dxdy );
        Debug.pnt.add( curr, 0x00ff00, 3 );
        Debug.ln.add( prev, curr, 0x00ff00 );

        Debug.ln.add( curr, dxdy.scale(1).add( curr ), 0xffffff );
        
        prev.copy( curr );
    }
}

function renderSplineCurves( spline, samp=10, incPnts=true ){
    const prev  = new Vec3();
    const curr  = new Vec3();
    const dxdy  = new Vec3();
    const dxdy2 = new Vec3();
    let t;

    samp -= 1;

    for( let c=0; c < spline.curveCount; c++ ){
        spline.atCurve( c, 0, prev );
        if( incPnts ) Debug.pnt.add( prev, 0x00ff00, 3 );
        
        for( let i=1; i <= samp; i++ ){
            t = i / samp;
            spline.atCurve( c, t, curr, dxdy, dxdy2 );

            if( incPnts ) Debug.pnt.add( curr, 0x00ff00, 3 );
            Debug.ln.add( prev, curr, 0x00ff00 );
            // Debug.ln.add( curr, vec3.scaleThenAdd( vec3.norm( dxdy ), 0.5, curr ), 0xffffff );
            // Debug.ln.add( curr, vec3.scaleThenAdd( vec3.norm( dxdy2 ), 0.5, curr ), 0x00ffff );

            prev.copy( curr );
        }
    }
}

function renderControls( spline ){
    const pnt = spline.points;
    let ii;
    for( let i=1; i < pnt.length; i+=2 ){
        ii = (i+1) % pnt.length;

        Debug.ln.add( pnt[i-1].pos, pnt[i].pos, 0x909090 );
        Debug.ln.add( pnt[ii].pos, pnt[i].pos, 0x909090 );
    }
}

function renderSamplerPnts( samp ){

    for( const i of samp.iterPoints() ){
        Debug.pnt.add( i, 0xffff00, 3 )

    }

}

function renderSamplerMinPnts( samp ){
    for( const [i,v] of samp.points.entries() ){
        Debug.pnt.add( v, 0xffff00, 3 )
        if( i !== 0 ) Debug.ln.add( samp.points[i-1], v, 0x00ff00 );
    }
}
//#endregion

</script></body></html>
