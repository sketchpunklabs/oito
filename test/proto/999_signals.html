// Scheduler for batching updates
const scheduler = {
  tasks: new Set(),
  running: false,

  schedule(task) {
    this.tasks.add(task);
    if (!this.running) {
      this.running = true;
      queueMicrotask(() => this.flush());
    }
  },

  flush() {
    // Run all scheduled tasks
    for (const task of this.tasks) {
      try {
        task();
      } catch (error) {
        console.error('Error in effect:', error);
      }
    }
    
    // Clear tasks and reset running flag
    this.tasks.clear();
    this.running = false;
  }
};



// Effect tracking
let currentEffect = null;

class Signal {
  #value;
  #subscribers = new Set();
  #pending = new Set();
  
  constructor(initialValue) {
    this.#value = initialValue;
  }
  
  get value() {
    if (currentEffect) {
      this.#subscribers.add(currentEffect);
    }
    return this.#value;
  }
  
  set value(newValue) {
    if (this.#value === newValue) return;
    this.#value = newValue;
    
    // Queue subscribers that need to be run
    for (const effect of this.#subscribers) {
      this.#pending.add(effect);
    }
    
    // Schedule update if we have pending effects
    if (this.#pending.size > 0) {
      scheduler.schedule(() => this.#notify());
    }
  }
  
  #notify() {
    // Run pending effects and clear them
    const effects = Array.from(this.#pending);
    this.#pending.clear();
    this.#subscribers.clear();
    effects.forEach(effect => effect());
  }
  
  update(fn) {
    this.value = fn(this.#value);
  }
}

// Create a computed signal
function computed(fn) {
  const signal = new Signal(undefined);
  const compute = () => {
    currentEffect = compute;
    signal.value = fn();
    currentEffect = null;
  };
  compute();
  return signal;
}

// Create an effect
function effect(fn) {
  const run = () => {
    currentEffect = run;
    fn();
    currentEffect = null;
  };
  run();
}

// Create a DOM binding helper
function bind(element, signal) {
  effect(() => {
    element.textContent = signal.value;
  });
}

// Batch multiple signal updates
function batch(fn) {
  const prevEffect = currentEffect;
  currentEffect = null;
  fn();
  currentEffect = prevEffect;
}

// Transaction helper for atomic updates
function transaction(fn) {
  batch(() => {
    // Run the transaction function
    fn();
    
    // Force flush the scheduler
    scheduler.flush();
  });
}
