const nodeStack = [];

class Node {
    constructor(nodeType, props = {}) {
        this.nodeType = nodeType;
        Object.assign(this, props);

        if (nodeStack.length > 0) {
            const parent = nodeStack[nodeStack.length - 1];
            if (!parent.children) parent.children = [];
            parent.children = [...new Set([...parent.children, this])];
        }
    }

    toVar(name) {
        this.varName = name;
        return this;
    }

    execute(fn) {
        nodeStack.push(this);
        const result = fn();
        nodeStack.pop();
        return result;
    }

    toJSON() {
        const json = { nodeType: this.nodeType };
        if (this.varName) json.varName = this.varName;
        Object.entries(this).forEach(([key, value]) => {
            if (!['nodeType', 'children', 'varName'].includes(key)) {
                json[key] = value instanceof Node ? value.toJSON() : value;
            }
        });
        if (this.children?.length > 0) {
            json.children = this.children.map(child => child.toJSON());
        }
        return json;
    }
}

export const add = (v0, v1) => {
    const node = new Node('add', { v0, v1 });
    nodeStack[0]?.children?.push(node);
    return node;
};

export const multiple = (v0, v1) => {
    const node = new Node('multiple', { v0, v1 });
    nodeStack[0]?.children?.push(node);
    return node;
};

export const Float = (value) => new Node('float', { value: value.toString() });
export const span = () => {
    const node = new Node('span');
    return new Proxy(node, {
        set(target, prop, value) {
            target[prop] = value;
            return true;
        }
    });
};

export function build(callback) {
    nodeStack.length = 0;
    const rootNode = new Node('root');
    rootNode.execute(callback);
    return rootNode.toJSON();
}
