<body><script type="module">
//#region IMPORTS
// import { Vec3, Quat }  from '@oito/oop';
//#endregion

//#region MAIN


window.addEventListener( 'load', async _=>{

    van.add( document.body, a({ href: "javascript:void(0)", onclick:()=>console.log('x') }, '🍦VanJS' ) );
    // van.add(document.body, button({ onclick:()=>console.log('x')}, 'Test' ) );
    */

    /*

        p("👋Hello"),
        ul(
            li("🗺️World"),

    */

    const {button, span} = van.tags;

        const counter = van.state(0);

        // van.derive(() => console.log("Counter: ", counter.val))
        // During ADD that BIND is called for Counter
        // let child = protoOfC === stateProto ? bind(() => c.val) :
        return span(
            "❤️ ", counter, " ",

//#endregion

// https://github.com/vanjs-org/van
// Global variables - aliasing some builtin symbols to reduce the bundle size.
let Obj = Object, _undefined, protoOf = Obj.getPrototypeOf, doc = document
let changedStates, curDeps, curNewDerives, alwaysConnectedDom = {isConnected: 1}, gcCycleInMs = 1000, statesToGc, propSetterCache = {}
let objProto = protoOf(alwaysConnectedDom), funcProto = protoOf(protoOf)

let addAndScheduleOnFirst = (set, s, f, waitMs) =>{

    console.log( 'addAndScheduleOnFirst', set, s, f, waitMs );

//   return ( set ?? ( setTimeout(f, waitMs) , new Set) ).add(s);

  if( !set ){
    setTimeout( f, waitMs )
    set = new Set();
  }

  set.add( s );
  return set;

}

let runAndCaptureDeps = (f, deps, arg) => {
    
  let prevDeps = curDeps
  curDeps = deps

//   console.log( "runAndCaptureDeps F, DEP, ARG", f, deps, arg );
//   console.log( "runAndCaptureDeps prev, cur", prevDeps, Array.from(curDeps.values()) );

  try {
    // console.log( "runAndCaptureDeps meh2", Array.from(curDeps.values()) );
    // Execute function to bind??
    // When state.val is called, it adds the state object to current Dependencies
    return f(arg)
    
  } catch (e) {
    console.error(e)
    return arg

  } finally {
    // console.log( "runAndCaptureDeps meh", Array.from(curDeps.values()) );
    // CurDeps now swops back to what is was before being called
    curDeps = prevDeps
  }
}

let keepConnected = l => l.filter(b => b._dom?.isConnected)

let addStatesToGc = (d) =>{

    console.log( 'AddStateToGC', d );

    statesToGc = addAndScheduleOnFirst( statesToGc, d, () => {
        console.log( 'TimeOut Schedule on first', statesToGc );
        // Goes threw the list of state filtering out
        // Any bindings or listeners who's element is not connected
        for (let s of statesToGc){
            s._bindings  = keepConnected(s._bindings);
            s._listeners = keepConnected(s._listeners);
        }
        statesToGc = _undefined
    }, gcCycleInMs );
};

let stateProto = {
  get val() {
    curDeps?.add(this)
    return this._val
  },

  get oldVal() {
    curDeps?.add(this)
    return this._oldVal
  },

  set val(v) {
    // Aliasing `this` to reduce the bundle size.
    let s = this
    if (v !== s._val) {
      s._val = v
      let listeners = [...s._listeners = keepConnected(s._listeners)] // Clears out listeners of elements no longer attached to document

      for (let l of listeners){
        derive(l.f, l.s, l._dom)
        l._dom = _undefined
      }

      s._bindings.length
        ? changedStates = addAndScheduleOnFirst(changedStates, s, updateDoms) 
        : s._oldVal = v
    }
  },
}

// let state = initVal => ({
//   __proto__: stateProto,
//   _val: initVal,
//   _oldVal: initVal,
//   _bindings: [],
//   _listeners: [],
// })

function state(initVal){
    return {
        __proto__   : stateProto,
        _val        : initVal,
        _oldVal     : initVal,
        _bindings   : [],
        _listeners  : [],
    }
}


// console.log( 'STATE', state, state(0).val );

let isState = s => protoOf(s ?? 0) === stateProto

let val = s => isState(s) ? s.val : s
let oldVal = s => isState(s) ? s.oldVal : s

let bind = (f, dom) => {
    console.log( 'Bind F, DOM', f, dom );
    // console.trace( 'bind' );

  let   deps           = new Set, 
        binding        = {f}, 
        prevNewDerives = curNewDerives;

//   console.log( 'Derives cur, prev', curNewDerives, prevNewDerives );

  curNewDerives = []

//   console.log( 'PRE DEPS', Array.from( deps.values() ) );

    // Executes F & if VAL is called, it will fill in Deps
  let newDom = runAndCaptureDeps( f, deps, dom );

//   console.log( 'Post DEPS', Array.from( deps.values() ) );

//   console.log( 'NEwDOM', newDom, (newDom ?? doc).nodeType );

  newDom = (newDom ?? doc).nodeType ? newDom : new Text(newDom)

  // If F calls a state.val, it will fill in Deps
  // Then add to state reference to the function that calls it.
  for (let d of deps){
    addStatesToGc(d)
    d._bindings.push(binding)

    console.log( 'AddBinding', binding );
  }


  // TODO: What this?
  for (let l of curNewDerives) l._dom = newDom

  curNewDerives = prevNewDerives
  return binding._dom = newDom
}

// Run a function, then add it as a listener to any state values that are used.
let derive = (f, s = state(), dom) => {
  let deps     = new Set;
  let listener = { f, s };

  listener._dom = dom ?? curNewDerives?.push(listener) ?? alwaysConnectedDom
  s.val = runAndCaptureDeps(f, deps)

  for (let d of deps){
    addStatesToGc(d)
    d._listeners.push(listener)
  }

  return s;
}

let add = (dom, ...children) => {
  for (let c of children.flat(Infinity)) {
    let protoOfC = protoOf(c ?? 0)

    if( protoOfC === stateProto ) console.log( 'ADD STATE AS CHILD', c._bindings );

    let child = protoOfC === stateProto ? bind(() => c.val) :
      protoOfC === funcProto ? bind(c) : c

      if( protoOfC === stateProto ) console.log( 'ADD STATE AS CHILD POST', c._bindings );

    if (child != _undefined) dom.append(child)
  }
  return dom
}

let _ = f => (f._isBindingFunc = 1, f)

let tagsNS = ns => new Proxy((name, ...args) => {
  let [props, ...children] = protoOf(args[0] ?? 0) === objProto ? args : [{}, ...args]
  let dom = ns ? doc.createElementNS(ns, name) : doc.createElement(name)

    // console.log( "TAG", name );

  for (let [k, v] of Obj.entries(props)) {
    let getPropDescriptor = proto => proto ?
      Obj.getOwnPropertyDescriptor(proto, k) ?? getPropDescriptor(protoOf(proto)) :
      _undefined
    
    let cacheKey   = name + "," + k
    let propSetter = propSetterCache[cacheKey] ??
      (propSetterCache[cacheKey] = getPropDescriptor(protoOf(dom))?.set ?? 0)

    let setter   = propSetter ? propSetter.bind(dom) : dom.setAttribute.bind(dom, k)
    let protoOfV = protoOf(v ?? 0)
    
    if (protoOfV === stateProto){
        bind(() => (setter(v.val), dom))
    }else if (protoOfV === funcProto && (!k.startsWith("on") || v._isBindingFunc)){
        bind(() => (setter(v()), dom))
    }else{
        setter(v)
    }
  }
  return add(dom, ...children)
}, {get: (tag, name) => tag.bind(_undefined, name)})


let update = (dom, newDom) => newDom ? newDom !== dom && dom.replaceWith(newDom) : dom.remove()


let updateDoms = () => {
  let changedStatesArray = [...changedStates].filter(s => s._val !== s._oldVal)
  changedStates = _undefined
  for (let b of new Set(changedStatesArray.flatMap(s => s._bindings = keepConnected(s._bindings))))
    update(b._dom, bind(b.f, b._dom)), b._dom = _undefined
  for (let s of changedStatesArray) s._oldVal = s._val
}

let hydrate = (dom, f) => update(dom, bind(f, dom))

const van =  {add, _, tags: tagsNS(), tagsNS, state, val, oldVal, derive, hydrate}

</script></body></html>
