<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title></title></head>
<style>canvas{ display:block; } body, html { padding:0px; margin:0px; width:100%; height:100%; }</style>
<body><script type="module">
// #region IMPORTS
import useThreeWebGL2, { THREE, useDarkScene, useVisualDebug } from '../../_lib/useThreeWebGL2.js';
import Util         from '../../_lib/misc/Util.js';

// import { Vec3 }     from '../../../packages/oop/src/index.ts';

// https://tweakpane.github.io/docs/
// https://tweakpane.github.io/docs/plugins/#essentials
import { Pane }                 from '../../_lib/thirdparty/tweakpane-4.0.4.min.js';
import * as TweakpaneEssentials from '../../_lib/thirdparty/tweakpane-plugin-essentials-0.2.1.min.js';
// #endregion

// #region MAIN
let App   = useDarkScene( useThreeWebGL2() );
let Debug = {};
let Ref   = {
    radius      : 1,
    subdivide   : 2,
    xdist       : 1,
    ydist       : 1,
    zdist       : 1,
    wmesh       : null,
    smesh       : null,
};

window.addEventListener( 'load', async _=>{
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Setup
    App.sphericalLook( 0, 20, 5 );
    Debug = await useVisualDebug( App );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    buildPrimitive();
    Ref.updatePrimtive = debounce( buildPrimitive, 300 );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    App.renderLoop();
    buildUI();
});

async function buildUI(){    
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    const p = new Pane();
    p.registerPlugin( TweakpaneEssentials );
    p.on( 'change', e=>{ 
        Ref.updatePrimtive( Ref ); 
    });

    // const f = p.addFolder({ title: 'User Interface', expanded: true });
    // f.addButton({ title: 'Button1' }).on( 'click', ()=>console.log('Button1') );

    const f = p.addFolder({ title: 'Octasphere Params', expanded: true });
    f.addBinding( Ref, 'radius',    { min: 0.1, max: 4, step: 0.1, label: 'Radius' } );
    f.addBinding( Ref, 'subdivide', { min: 1, max: 4, step: 1,   label: 'SubDivide' } );
    f.addBinding( Ref, 'xdist',     { min: 0, max: 3, step: 0.1, label: 'X Dist' } );
    f.addBinding( Ref, 'ydist',     { min: 0, max: 3, step: 0.1, label: 'Y Dist' } );
    f.addBinding( Ref, 'zdist',     { min: 0, max: 3, step: 0.1, label: 'Z Dist' } );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Ref.pane = p;
}

function buildPrimitive(){
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Cleanup existing meshes
    if( Ref.wmesh ){
        App.scene.remove( Ref.wmesh );
        App.scene.remove( Ref.smesh );

        Ref.wmesh.geometry.dispose();
        Ref.wmesh.material.dispose();
        Ref.smesh.geometry.dispose();
        Ref.smesh.material.dispose();
    }

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Build new mesh
    const oGeo  = OctaSphere.create( Ref );
    const bGeo  = Util.geoBuffer( oGeo );

    const smesh = new THREE.Mesh( bGeo, new THREE.MeshBasicMaterial( { color:0x505050, opacity:0.95, transparent: true } ) );
    smesh.scale.setScalar( 0.99 );
    App.scene.add( smesh );

    const wmesh = new THREE.Mesh( bGeo, new THREE.MeshBasicMaterial( { color:0xa0a0a0, wireframe:true } ) );
    App.scene.add( wmesh );

    Ref.smesh = smesh;
    Ref.wmesh = wmesh;

    console.log( 'build' )
}

function debounce( fn, delay=20 ){
    let id = -1;
    return ( ...args )=>{
        if( id !== -1 ) clearTimeout( id );
        // id = setTimeout( ()=>fn.apply( null, args ), delay );
        id = setTimeout( ()=>fn( ...args ), delay );
    };
}

// #endregion

// Reference
// https://prideout.net/blog/octasphere/
// https://twitter.com/prideout/status/1207329956616798208

class OctaSphere{
    static create( _props={} ){
        const props = Object.assign({
            subdivide   : 2,
            radius      : 1,
            xdist       : 1,
            ydist       : 1,
            zdist       : 1,
        }, _props );

        const vshape    = this.tessellate( props.subdivide, props.radius );     // Generate Corner
        const ishape    = this.indices( props.subdivide );                      // Generate Triangles
        const shapeSize = vshape.length / 3;                                    // How many verts in shape

        // Offset HALF distances
        const ox        = props.xdist * 0.5; 
        const oy        = props.ydist * 0.5;
        const oz        = props.zdist * 0.5;

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Clone & Transform Corner Vertices
        const vbuf = [];
        this.vpush( vshape, vbuf, 0, 0, [ox,oy,oz] );    // Top XZ
        this.vpush( vshape, vbuf, 1, 0, [ox,oy,-oz] );   // Top X-Z
        this.vpush( vshape, vbuf, 2, 0, [-ox,oy,-oz] );  // Top -X-Z
        this.vpush( vshape, vbuf, 3, 0, [-ox,oy,oz] );   // Top -XZ

        this.vpush( vshape, vbuf, 0, 1, [ox,-oy,oz] );   // Bot XZ
        this.vpush( vshape, vbuf, 1, 1, [ox,-oy,-oz] );  // Bot X-Z
        this.vpush( vshape, vbuf, 2, 1, [-ox,-oy,-oz] ); // Bot -X-Z
        this.vpush( vshape, vbuf, 3, 1, [-ox,-oy,oz] );  // Bot -XZ

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Clone & Increment Corner Indices
        const ibuf = [];
        this.ipush( ishape, ibuf, shapeSize * 0 );
        this.ipush( ishape, ibuf, shapeSize * 1 );
        this.ipush( ishape, ibuf, shapeSize * 2 );
        this.ipush( ishape, ibuf, shapeSize * 3 );
        this.ipush( ishape, ibuf, shapeSize * 4, true );
        this.ipush( ishape, ibuf, shapeSize * 5, true );
        this.ipush( ishape, ibuf, shapeSize * 6, true );
        this.ipush( ishape, ibuf, shapeSize * 7, true );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Stitching corners together
        const poleCache = [];
        const fnPole    = ( ary )=>{
            for( const i of ary ){
                if( poleCache.indexOf( i ) === -1 ){
                    this.poleIndices( ibuf, props.subdivide, shapeSize, i );
                    poleCache.push( i );
                }
            }
        }

        if( props.zdist ){
            fnPole( [0,1,3,5] );
            this.horiIndices( ibuf, props.subdivide, shapeSize * 0, shapeSize * 1 );        // Top X+
            this.horiIndices( ibuf, props.subdivide, shapeSize * 2, shapeSize * 3 );        // Top X-
            this.horiIndices( ibuf, props.subdivide, shapeSize * 4, shapeSize * 5, true );  // Bot X+
            this.horiIndices( ibuf, props.subdivide, shapeSize * 6, shapeSize * 7, true );  // Bot X-
        }

        if( props.xdist ){
            fnPole( [0,1,2,4] );
            this.horiIndices( ibuf, props.subdivide, shapeSize * 3, shapeSize * 0 );        // Top Z+
            this.horiIndices( ibuf, props.subdivide, shapeSize * 1, shapeSize * 2 );        // Top Z-
            this.horiIndices( ibuf, props.subdivide, shapeSize * 7, shapeSize * 4, true );  // Bot Z+
            this.horiIndices( ibuf, props.subdivide, shapeSize * 5, shapeSize * 6, true );  // Bot Z-
        }

        if( props.ydist ){
            fnPole( [2,4,3,5] );
            this.vertIndices( ibuf, props.subdivide, shapeSize * 0, shapeSize * 4 ); // +X+Z
            this.vertIndices( ibuf, props.subdivide, shapeSize * 1, shapeSize * 5 ); // +X-Z
            this.vertIndices( ibuf, props.subdivide, shapeSize * 2, shapeSize * 6 ); // -X-Z
            this.vertIndices( ibuf, props.subdivide, shapeSize * 3, shapeSize * 7 ); // -X+Z
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Debug
        // const v    = [0,0,0];
        // for( let i=0; i < vbuf.length; i+=3 ){
        //     v[0] = vbuf[i+0];
        //     v[1] = vbuf[i+1];
        //     v[2] = vbuf[i+2];
        //     Debug.pnt.add( v, 0xffff00, 1 );
        // }

        return {
            vertices    : vbuf,
            indices     : ibuf,
            normals     : this.createNorms( vshape, vbuf ),
            // texcoord,
        };
    }

    // #region CREATE CORNER
    static tessellate( subdiv=2, radius=1 ){
        const pi_h  = Math.PI * 0.5;
        const p0    = [0,0,0];
        const p1    = [0,0,0];
        const n     = 2**subdiv;
        const vcnt  = ( n + 1 ) * ( n + 2 ) / 2; // Vert Count
        const out   = [];
        // const irow  = [];

        let theta;
        let s;
        let c;
        let cnt = 0;

        for( let i=0; i < n; i++ ){
            theta = pi_h * i / n;       // Vertical Angle, from equator to pole
            c     = Math.cos( theta );
            s     = Math.sin( theta );

            // irow.push( cnt )    // Save Starting index of this row
            // cnt += n - i + 1 ;  // How many vertices created in this arc

            p0[0] = 0; p0[1] = s; p0[2] = c;   // Left Point
            p1[0] = c; p1[1] = s; p1[2] = 0;   // Right Point

            out.push( p0[0] * radius, p0[1] * radius, p0[2] * radius ); // First arc point
            this.geodesic( p0, p1, n-i, radius, out );                  // In between arc points
            out.push( p1[0] * radius, p1[1] * radius, p1[2] * radius ); // Last arc point
        }

        out.push( 0,radius,0 ); // Pole Point
        // irow.push( cnt );       // Pole Index

        return out; // [out, irow];
    }

    // Lerp between two points to form an 90 degree arc
    static geodesic( p0, p1, segCnt, radius, outVerts ){
        if( segCnt < 2 ) return;

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Get angle : acos( dot( a, b ) ) 
        const rad  = Math.acos( p0[0]*p1[0] + p0[1]*p1[1] + p0[2]*p1[2] );
        const inc  = rad / segCnt;
        const v    = [0,0,0];

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Get rotation axis : norm( cross( a, b ) )
        const axis = [
            p0[1] * p1[2] - p0[2] * p1[1],
            p0[2] * p1[0] - p0[0] * p1[2],
            p0[0] * p1[1] - p0[1] * p1[0],
        ];

        const iMag = 1 / Math.sqrt( axis[0]**2 +  axis[1]**2 + axis[2]**2 );
        axis[ 0 ] *= iMag;
        axis[ 1 ] *= iMag;
        axis[ 2 ] *= iMag;

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Create vertices across the arc
        for( let i=1; i < segCnt; i++ ){
            this.applyAxisAngle( axis, i*inc, p0, v );
            outVerts.push( 
                v[0] * radius, 
                v[1] * radius, 
                v[2] * radius
            );
        }
    }
    
    // Generate the Indices for the corner
    static indices( subdiv ){
        const out   = [];
        const n     = 2**subdiv;
        let c       = 0;
        let i       = 0; // Bottom Row Index
        let ii      = 0; // Top Row Index
        let cnt     = 0;

        for( let r=0; r < n; r++ ){
            cnt = n - r + 1;    // How many verts in bottom row
            ii  = i + cnt;      // Top row starting index

            // Create quads between the two rows
            for( c=0; c < cnt-2; c++ ){
                out.push( 
                    c+i,   c+i+1,  c+ii, 
                    c+i+1, c+ii+1, c+ii
                );
            }

            out.push( c+i, c+i+1, c+ii ); // Triangle at the end
            i += cnt; // Increment by one rows worth of vertices
        }

        return out;
    }
    // #endregion

    // #region MATHS
    // Rotate a vertex around an axis without matrices or quaterions
    static applyAxisAngle( axis, rad, v, out ){
        // Rodrigues Rotation formula:
        // v_rot = v * cos(theta) + cross( axis, v ) * sin(theta) + axis * dot( axis, v) * (1-cos(theta))
        const c   = Math.cos( rad );
        const s   = Math.sin( rad );
        const ci  = 1 - c;
        const dot = axis[0]*v[0] + axis[1]*v[1] + axis[2]*v[2];
        const cp  = [ // CrossProduct
            axis[1] * v[2] - axis[2] * v[1],
            axis[2] * v[0] - axis[0] * v[2],
            axis[0] * v[1] - axis[1] * v[0],
        ];

        out[ 0 ] = v[ 0 ] * c + cp[ 0 ] * s + axis[ 0 ] * dot * ci;
        out[ 1 ] = v[ 1 ] * c + cp[ 1 ] * s + axis[ 1 ] * dot * ci;
        out[ 2 ] = v[ 2 ] * c + cp[ 2 ] * s + axis[ 2 ] * dot * ci;
        return out;
    }

    // Wizzy Vector Rotations
    static yn( v ){ const [x,y,z] = v; v[0] = z; v[1] = y; v[2] = -x; return v; }         //  zy-x rot y-90 
    static yn_yn( v ){ const [x,y,z] = v; v[0] = -x; v[1] = y; v[2] = -z; return v; }     // -xy-z rot y-90, y-90
    static yp( v ){ const [x,y,z] = v; v[0] = -z; v[1] = y; v[2] = x; return v; }         // -zyx  rot y+90
    static zp( v ){ const [x,y,z] = v; v[0] = y; v[1] = -x; v[2] = z; return v; }         // y-xz  rot z+90
    // #endregion

    // #region BUILDING FINAL MESH

    // push & modify vertex data
    static vpush( shape, buf, y, flip, offset ){
        const v = [0,0,0];
        
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        let yrot = undefined;
        switch( y ){
            case 1: yrot = this.yn;    break;
            case 2: yrot = this.yn_yn; break;
            case 3: yrot = this.yp;    break;
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        for( let i=0; i < shape.length; i+=3 ){
            v[0] = shape[ i+0 ];
            v[1] = shape[ i+1 ];
            v[2] = shape[ i+2 ];

            if( flip ) v[1] = -v[1];
            if( yrot ) yrot( v );

            v[0] += offset[ 0 ];
            v[1] += offset[ 1 ];
            v[2] += offset[ 2 ];

            buf.push( ...v );
        }
    }

    // Create normals for all the vertices, MUST create in the same order of verts
    static createNorms( shape, verts ){
        const out = [];
        const v   = [0,0,0];
        let   l   = 0;
        
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Initial Normals for the first Corner, Just normalize the verts
        for( let i=0; i < shape.length; i+=3 ){
            l = Math.sqrt( shape[i+0]**2 + shape[i+1]**2 + shape[i+2]**2 );
            out.push(
                shape[i+0] / l,
                shape[i+1] / l,
                shape[i+2] / l,
            )
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Rotate normals for the remaining top corners
        const fnRot = ( rot )=>{
            for( let i=0; i < shape.length; i+=3 ){
                v[0] = out[i+0]; v[1] = out[i+1]; v[2] = out[i+2];
                out.push( ...rot( v ) );
            }
        }

        fnRot( this.yn );
        fnRot( this.yn_yn );
        fnRot( this.yp );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Create buttom vertices
        const ox = out.length;
        for( let i=0; i < ox; i+=3 ){
            out.push( out[i+0], -out[i+1], out[i+2] );
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Debug
        // const a = [0,0,0];
        // for( let i=0; i < out.length; i+=3 ){
        //     v[0] = out[i+0] * 0.2 + verts[i+0];
        //     v[1] = out[i+1] * 0.2 + verts[i+1];
        //     v[2] = out[i+2] * 0.2 + verts[i+2];
        //     a[0] = verts[i+0];
        //     a[1] = verts[i+1];
        //     a[2] = verts[i+2];

        //     Debug.ln.add( a, v, 0x00ff00 );
        // }

        return out;
    }

    // push & modify inddex data
    static ipush( shape, buf, offset, rev=false ){ 
        for( let i=0; i < shape.length; i+=3 ){
            if( rev ){
                buf.push(
                    shape[ i+2 ] + offset,
                    shape[ i+1 ] + offset,
                    shape[ i+0 ] + offset,
                );
            }else{
                buf.push(
                    shape[ i+0 ] + offset,
                    shape[ i+1 ] + offset,
                    shape[ i+2 ] + offset,
                );
            }
        }
    }

    // Connect each vertical rows of the corner together
    static horiIndices( buf, subdiv, o0, o1, rev=false ){
        const n = 2**subdiv;
        let off = 0;    // Row offset
        let s, a, b, c, d;

        for( let i=0; i < n; i++ ){
            // Size - Vert count for the row
            s = n - i + 1;

            // Compute indices of a Quad
            a = o0 + off + s - 1;   // Bot L
            b = o1 + off;           // Bot R
            c = b + s;              // Top R
            d = a + s - 1;          // Top L

            // Add 2 triangles
            if( rev ) buf.push( c, b, a, a, d, c );   
            else      buf.push( a, b, c, c, d, a );

            off += s; // Next row
        }
    }

    // Connect the first row of each corner together
    static vertIndices( buf, subdiv, o0, o1, rev=false ){
        const n = 2**subdiv;
        let a, b, c, d;

        for( let i=0; i < n; i++ ){
            a = o0 + i;
            b = o1 + i;
            c = b + 1;
            d = a + 1;

            buf.push( a, b, c, c, d, a );
        }
    }

    // Connect 4 pole points to form rect square
    static poleIndices( buf, subdiv, size, pole = 0 ){
        const n = 2**subdiv;
        let a, b, c, d;

        switch( pole ){
            case 0: // Top
                a = size - 1;
                b = size * 2 - 1;
                c = size * 3 - 1;
                d = size * 4 - 1;
                break;

            case 1: // Bottom : Rev for proper winding
                a = size * 8 - 1;
                b = size * 7 - 1;
                c = size * 6 - 1;
                d = size * 5 - 1;
                break;

            case 2: // Forward 
                a = size * 3 + n;
                b = size * 7 + n;
                c = size * 4;
                d = size * 0;
                break;

            case 3: // Right 
                a = size * 0 + n;
                b = size * 4 + n;
                c = size * 5;
                d = size * 1;
                break;

            case 4: // Back
                a = size * 1 + n;
                b = size * 5 + n;
                c = size * 6;
                d = size * 2;
                break;
            
            case 5: // Left
                a = size * 2 + n;
                b = size * 6 + n;
                c = size * 7;
                d = size * 3;
                break;
        }

        buf.push( a, b, c, c, d, a );
    }

    // #endregion
}
