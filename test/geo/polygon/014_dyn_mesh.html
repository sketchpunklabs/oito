function isPoly2DClockwise( pnts ){
    const end = ( pnts.length / 2 ) - 1;
    let sum   = 0;
    let i, ii;

    for (let j = 0; j < end; j++){
        i   = j * 2;
        ii  = ( j + 1 ) * 2;
        // sum += ( pnts[ii][0] - pnts[i][0] ) * ( pnts[ii][1] + pnts[i][1] );
        // https://www.baeldung.com/cs/list-polygon-points-clockwise#2-area-of-polygon
        // sum += pnts[i][0] * pnts[ii][1] - pnts[i][1] * pnts[ii][0];
        sum += pnts[i+0] * pnts[ii+1] - pnts[i+1] * pnts[ii+0]; // For Flat Array
    }

    // return ( sum < 0 );
    return ( sum >= 0 );
}

import earcut from '../../_lib/thirdparty/earcut.js';
class DynPolygonMesh extends THREE.Mesh{
    // #region MAIN
    constructor( mat, pnts ){
        super( 
            undefined,
            mat 
            || new THREE.MeshPhongMaterial( { color: 0xff0000, side:THREE.DoubleSide } )
        );

        if( pnts ) this.fromPointArray( pnts );
    }
    // #endregion

    fromPointArray( ary ){
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Flatten data
        const vertices = [];    // Flatten 3D Mesh Data
        const flat     = [];    // 2D flatten data (XZ) for earcut
        for( let i of ary ){
            vertices.push( ...i );
            flat.push( i[0], i[2] );
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Compute triangle faces
        const indices = earcut( flat, null, 2 );
        if( indices.length == 0 ){
            console.log( 'Earcut failed creating indices', flat );
            return;
        }

        // Reverse Triangles to CCW order, since webgl renders
        // the front face with CCW winding
        if( isPoly2DClockwise( flat ) ){
            let t;
            for( let i=0; i < indices.length; i+=3 ){
                t              = indices[ i ];
                indices[ i ]   = indices[ i+2 ];
                indices[ i+2 ] = t;
            }
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Finalize
        this._updateGeometry( vertices, indices );
    }

    _updateGeometry( vertices, indices ){
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Should we build new geometry buffers?
        const geo   = this.geometry;
        const bVert = geo.attributes.position;
        const bIdx  = geo.index;

        if( !bIdx || 
            !bVert ||
            indices.length > bIdx.array.length ||
            vertices.length > bVert.array.length
        ){
            console.log( bVert, bIdx );
            this._rebuildGeometry( vertices, indices );
            return;
        }
        // console.log( bVert.array.length, vertices.length );
        // console.log( bIdx.array.length, indices.length );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // No rebuild, Update what we have
        bVert.array.set( vertices );
        bVert.count       = vertices.length / 3;
        bVert.needsUpdate = true;

        bIdx.array.set( indices );
        bIdx.count       = indices.length;
        bIdx.needsUpdate = true;

        geo.setDrawRange( 0, bIdx.count );
        geo.computeBoundingBox();
        geo.computeBoundingSphere();

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Compute normals
        geo.computeVertexNormals();
        const bNorm       = geo.attributes.normal;
        bNorm.count       = bVert.count;
        bNorm.needsUpdate = true;
    }

    _rebuildGeometry( vertices, indices ){
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        if( !( indices instanceof Uint32Array || indices instanceof Uint16Array ) ){
            indices = new Uint16Array( indices );
        }

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Create Buffers
        const bVert    = new THREE.Float32BufferAttribute( vertices, 3 );
        const bIdx     = new THREE.BufferAttribute( indices, 1 );
        bVert.setUsage( THREE.DynamicDrawUsage );
        bIdx.setUsage( THREE.DynamicDrawUsage );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Build Geometry
        const geo = new THREE.BufferGeometry();
        geo.setAttribute( 'position', bVert );
        geo.setIndex( bIdx );
        
        geo.setDrawRange( 0, bIdx.count );
        geo.computeBoundingBox();
        geo.computeBoundingSphere();
        geo.computeVertexNormals();

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        if( this.geometry ) this.geometry.dispose();
        this.geometry = geo;
    }

    // reset(){
