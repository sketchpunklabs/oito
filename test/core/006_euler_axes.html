function toEulerYXZ( q, inDeg = true ){
    const out = [0, 0, 0];

    const [x, y, z, w] = q;
    const x2 = x + x;
    const y2 = y + y;
    const z2 = z + z;
    const m23 = y * z2 - w * x2;

    out[0] = Math.asin(-Math.min(1, Math.max(-1, m23)));
    if (Math.abs(m23) < 0.9999999) {
      out[1] = Math.atan2(x * z2 + w * y2, 1 - (x * x2 + y * y2));
      out[2] = Math.atan2(x * y2 + w * z2, 1 - (x * x2 + z * z2));
    } else {
      out[1] = Math.atan2(-(x * z2 - w * y2), 1 - (y * y2 + z * z2));
      out[2] = 0;
    }

    if (inDeg) {
      out[0] *= 180 / Math.PI;
      out[1] *= 180 / Math.PI;
      out[2] *= 180 / Math.PI;
    }
    return out;
}


function toEuler(quaternion) {
    // Extract quaternion components
    var x = quaternion[0];
    var y = quaternion[1];
    var z = quaternion[2];
    var w = quaternion[3];
    
    // Yaw (Y), Pitch (X), Roll (Z)
    var ysqr = y * y;

    // Roll (z-axis rotation)
    var t0 = +2.0 * (w * x + y * z);
    var t1 = +1.0 - 2.0 * (x * x + ysqr);
    var roll = Math.atan2(t0, t1);

    // Pitch (x-axis rotation)
    var t2 = +2.0 * (w * y - z * x);
    t2 = t2 > 1.0 ? 1.0 : t2;
    t2 = t2 < -1.0 ? -1.0 : t2;
    var pitch = Math.asin(t2);

    // Yaw (y-axis rotation)
    var t3 = +2.0 * (w * z + x * y);
    var t4 = +1.0 - 2.0 * (ysqr + z * z);
    var yaw = Math.atan2(t3, t4);

    // Convert radians to degrees
    roll = roll * (180 / Math.PI);
    pitch = pitch * (180 / Math.PI);
    yaw = yaw * (180 / Math.PI);

    // Return Euler angles in YXZ order
    // return [yaw, pitch, roll];
    return [pitch, yaw , roll];
}


function toPolar(quaternion) {
  // Extract quaternion components
  const x = quaternion[0];
  const y = quaternion[1];
  const z = quaternion[2];
  const w = quaternion[3];

  // Calculate the squared norm of the imaginary part
  const norm = Math.sqrt(x * x + y * y + z * z);

  // Calculate azimuth (theta)
  let azimuth = Math.atan2(y, x);

  // Calculate elevation (phi)
  let elevation = Math.atan2(z, Math.sqrt(x * x + y * y));

  // Calculate magnitude (r)
  let magnitude = 2 * Math.acos(w);

  // Convert radians to degrees
  azimuth = azimuth * (180 / Math.PI);
  elevation = elevation * (180 / Math.PI);
  magnitude = magnitude * (180 / Math.PI);

  // Return polar coordinates
  return [azimuth, elevation, magnitude];
}
